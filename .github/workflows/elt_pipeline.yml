name: HCMC Real Estate ELT Pipeline

on:
  schedule:
    # Chạy tự động lúc 02:00 sáng giờ Việt Nam (UTC+7) = 19:00 UTC hằng ngày
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      crawler_samples:
        description: 'Số lượng tin đăng mới cần cào (samples)'
        required: false
        default: '300'
        type: string

permissions:
  contents: read

jobs:
  elt_daily_sync:
    name: Daily ELT Pipeline (Extract -> B2 Lake -> BigQuery -> dbt Star Schema)
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      # Backblaze B2 (Data Lake)
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL || 's3.us-east-005.backblazeb2.com' }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}

      # Google BigQuery (Data Warehouse)
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET || 'hcmc_real_estate' }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION || 'asia-southeast1' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Verify Python Environment
        run: |
          python --version
          Get-Command python | Select-Object -ExpandProperty Source

      - name: 3. Verify & Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: 4. Configure Google Cloud Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if (-not $env:GCP_SA_KEY) {
            Write-Error "Secret GCP_SA_KEY is empty or missing! Please configure GCP_SA_KEY in repository secrets."
            exit 1
          }

          $keyFile = Join-Path $env:GITHUB_WORKSPACE "gcp_key.json"
          if ($env:GCP_SA_KEY.Trim().StartsWith("{")) {
            $env:GCP_SA_KEY | Set-Content -Path $keyFile -Encoding utf8 -NoNewline
          } else {
            [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:GCP_SA_KEY)) | Set-Content -Path $keyFile -Encoding utf8 -NoNewline
          }
          Write-Host "GCP Service Account key created successfully at $keyFile"

      - name: 5. Extract & Load to Data Lake (Crawler -> Backblaze B2)
        run: |
          $samples = if ("${{ inputs.crawler_samples }}") { "${{ inputs.crawler_samples }}" } else { "300" }
          Write-Host "Starting Scrapling Crawler with target $samples samples and auto B2 sync..."
          python scrapling_crawler.py --samples $samples --early-stop 100 --upload-b2

      - name: 6. Load to Data Warehouse (Backblaze B2 -> Google BigQuery)
        run: |
          Write-Host "Loading new Parquet partitions from Backblaze B2 into BigQuery staging & raw_listings..."
          python load_bigquery.py

      - name: 7. Transform Data with dbt-bigquery (Medallion & Star Schema)
        run: |
          Write-Host "Running dbt transformations (stg_listings -> int_listings_deduplicated -> marts Star Schema)..."
          python -m dbt.cli.main run --project-dir dbt_hcmc_real_estate --profiles-dir dbt_hcmc_real_estate

      - name: 8. Execute Data Quality Tests (dbt test)
        run: |
          Write-Host "Executing automated data quality tests across staging, intermediate, and marts..."
          python -m dbt.cli.main test --project-dir dbt_hcmc_real_estate --profiles-dir dbt_hcmc_real_estate

      - name: 9. Cleanup Credentials
        if: always()
        run: |
          Write-Host "Cleaning up temporary credentials..."
          $keyFile = Join-Path $env:GITHUB_WORKSPACE "gcp_key.json"
          if (Test-Path $keyFile) {
            Remove-Item $keyFile -Force
          }
          Write-Host "Credentials file removed."
